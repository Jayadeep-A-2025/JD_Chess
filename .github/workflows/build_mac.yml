name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 python-chess pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --clean --add-data "assets:assets" --name="JD_Chess" main.py

    - name: Upload macOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JD_Chess_MacOS_App
        path: dist/JD_Chess.app
