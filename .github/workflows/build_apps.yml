name: Build Desktop Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 python-chess pyinstaller

    - name: Download & Bundle Stockfish (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        mkdir assets -ErrorAction SilentlyContinue
        Invoke-WebRequest -Uri "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-windows-x86-64-avx2.zip" -OutFile "stockfish.zip"
        Expand-Archive -Path "stockfish.zip" -DestinationPath "sf_temp"
        Get-ChildItem -Path "sf_temp" -Recurse -Filter "*.exe" | Copy-Item -Destination "assets\stockfish.exe"

    - name: Download & Bundle Stockfish (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p assets
        brew install stockfish
        cp $(which stockfish) assets/stockfish

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --clean --add-data "assets;assets" --name="JD_Chess" main.py

    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --clean --add-data "assets:assets" --name="JD_Chess" main.py
        cd dist && zip -r JD_Chess_macOS.zip JD_Chess.app

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: JD_Chess_Windows_EXE
        path: dist/JD_Chess.exe

    - name: Upload macOS Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: JD_Chess_MacOS_App
        path: dist/JD_Chess_macOS.zip
