name: Build Desktop Executables

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 python-chess pyinstaller

      - name: Download Stockfish (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-windows-x86-64-avx2.zip" `
            -OutFile stockfish.zip

          Expand-Archive -Path stockfish.zip -DestinationPath sf_temp

          $engine = Get-ChildItem sf_temp -Recurse -Filter "*.exe" |
            Select-Object -First 1

          if (-not $engine) {
            throw "Stockfish executable was not found in the downloaded archive."
          }

          Copy-Item $engine.FullName assets/stockfish.exe
          if (-not (Test-Path assets/stockfish.exe)) {
            throw "Stockfish was not copied into assets."
          }

      - name: Download Stockfish (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p assets
          brew install stockfish
          cp "$(command -v stockfish)" assets/stockfish
          chmod +x assets/stockfish
          test -f assets/stockfish

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --add-data "assets/icons;assets/icons" `
            --add-binary "assets/stockfish.exe;assets" `
            --name JD_Chess main.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --windowed --clean \
            --add-data "assets/icons:assets/icons" \
            --add-binary "assets/stockfish:assets" \
            --name JD_Chess main.py

          test -d dist/JD_Chess.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/JD_Chess.app dist/JD_Chess_macOS.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: JD_Chess_Windows_EXE
          path: dist/JD_Chess.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: JD_Chess_MacOS_App
          path: dist/JD_Chess_macOS.zip
